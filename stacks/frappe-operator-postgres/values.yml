# frappe-operator/frappe-operator  (PostgreSQL variant)
# Chart source: https://github.com/vyogotech/frappe-operator/tree/release/helm/frappe-operator
#
# Companion to stacks/frappe-operator, which is the MariaDB default. This listing
# backs Frappe sites with PostgreSQL instead, so the bundled MariaDB Operator is
# off and deploy.sh installs the StackGres operator beforehand.
#
# Keep this file MINIMAL. DigitalOcean's runner fetches it from the master branch
# of digitalocean/marketplace-kubernetes at install time, so every change needs a
# PR there plus a Vendor Portal re-submission.

# No in-cluster MariaDB. Safe to disable: nothing in the operator watches MariaDB
# CRs at manager startup, so it boots cleanly without those CRDs present.
mariadb-operator:
  enabled: false

mariadb:
  enabled: false

# KEDA stays on -- worker autoscaling is independent of the database engine.
keda:
  enabled: true
  crds:
    install: true

# deploy.sh runs the chart with --atomic --timeout 8m0s. Pulling ERPNext images
# and bootstrapping a PostgreSQL cluster will not fit in eight minutes, so no
# sample bench or site is created; the install would roll back and report failure.
examples:
  createBench: false
  createSite: false

# Not set here, deliberately:
#
# dbConfig. The database provider is chosen per FrappeBench and FrappeSite, not
# chart-wide, so there is nothing to set here -- users specify
# provider: postgres in their bench. See this stack's README.
#
# Ingress controller and cert-manager. DOKS ships neither, and an ingress
# controller provisions a billable Load Balancer. Left to the user.
